# Azure App Service deployment for the backend in /backend
name: Build and deploy Node.js app to Azure Web App - evaluacion-siembra-api-dev

on:
  push:
    branches:
      - sebastian-desarrollo
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: backend

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: backend

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D70D2284A6324FE1BA5B976F1CD29C3B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DC2E8A7A577E4F2D994BB1C14E37CE93 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_656D23B249894051B6A96499C70FBE2B }}

      - name: Deploy backend to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: evaluacion-siembra-api-dev
          slot-name: Production
          package: backend
